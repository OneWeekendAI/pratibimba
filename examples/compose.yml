# A self-hosted install: Postgres, Core (serve), the learning worker, and a nightly backup.
#   PRB_ADMIN_TOKEN=... docker compose -f examples/compose.yml up
# The backup service writes a timestamped SQL dump to examples/backups (next to this file) once a
# day, with a copy of the uploaded images beside it (`<dump>.assets/`); restore one into an empty
# database with `pratibimba restore <file>` (see the README).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: pratibimba
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The first start runs initdb and restarts Postgres; Core does not retry its first connect.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One image, built once and shared by serve, worker and backup.
  serve:
    build: ..
    image: pratibimba
    environment:
      PRB_DB: postgres://postgres:pratibimba@db:5432/postgres
      PRB_ADMIN_TOKEN: ${PRB_ADMIN_TOKEN:?set PRB_ADMIN_TOKEN}
      # Only when a page calls Core from another origin (a local test page); behind your own
      # /_prb proxy leave it empty.
      PRB_SITE_ORIGIN: ${PRB_SITE_ORIGIN:-}
    # Uploaded images. For S3/R2/MinIO instead, set PRB_ASSETS_S3_ENDPOINT, _BUCKET, _ACCESS_KEY
    # and _SECRET_KEY on serve and worker, and drop this volume.
    volumes:
      - assets:/var/lib/pratibimba/assets
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: pratibimba
    pull_policy: never
    command: worker
    environment:
      PRB_DB: postgres://postgres:pratibimba@db:5432/postgres
    # The worker deletes images no variant has named for a week.
    volumes:
      - assets:/var/lib/pratibimba/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # The cron: one dump a day. The image's pg_dump is Debian's 17; keep the server at 17 or older
  # (against a newer one, backup stops with an error naming both versions).
  # `migrate` first: it waits on serve's migration lock, so the dump taken at start-up never
  # catches the schema half-built.
  backup:
    image: pratibimba
    pull_policy: never
    entrypoint: ["/bin/sh", "-c", "while true; do pratibimba migrate && pratibimba backup /backups; sleep 86400; done"]
    # A bind mount is owned by the host user; root in the container can write to it.
    user: "0:0"
    environment:
      PRB_DB: postgres://postgres:pratibimba@db:5432/postgres
    volumes:
      - ./backups:/backups
      - assets:/var/lib/pratibimba/assets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  assets:

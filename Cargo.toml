[workspace]
members = ["core"]
resolver = "3"

# Proc-macro dylibs (sqlx-macros, serde_derive, ...) are built under this override. Since Rust 1.77
# release strips debuginfo by default, and on macOS 27 (ld-27037) stripping a proc-macro dylib leaves
# a "mis-aligned LINKEDIT string pool" that rustc then fails to dlopen. They never ship, so keep them
# unstripped; the shipped binary is still stripped as before.
[profile.release.build-override]
strip = false
